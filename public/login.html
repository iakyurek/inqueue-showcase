<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inQueue · Sign in</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background:#0a0b0d; color:#f2f3f5; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-card { background:#14161a; border:1px solid #23262d; border-radius:16px; padding:36px 32px 28px; width:100%; max-width:360px; box-shadow:0 12px 48px rgba(0,0,0,0.4); }
    .login-card h1 { margin:0 0 6px; font-size:20px; font-weight:600; letter-spacing:-0.01em; }
    .login-card p.sub { margin:0 0 24px; color:#8a8f98; font-size:13px; }
    .login-card label { display:block; font-size:12px; color:#a8adb5; margin-bottom:6px; }
    .login-card input { display:block; width:100%; box-sizing:border-box; background:#0a0b0d; border:1px solid #2b2f37; color:#f2f3f5; padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:16px; }
    .login-card input:focus { outline:none; border-color:#4a90ff; }
    .login-card button { display:block; width:100%; background:#3b7dff; border:0; color:white; font-weight:600; font-size:14px; padding:11px; border-radius:8px; cursor:pointer; }
    .login-card button:hover { background:#4a8bff; }
    .login-card button:disabled { opacity:0.6; cursor:not-allowed; }
    .login-error { display:none; background:#3d1a1f; border:1px solid #6b2732; color:#f7a2ab; padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:16px; }
    .login-error.show { display:block; }
    .brand { text-align:center; margin-bottom:20px; font-size:11px; letter-spacing:0.16em; color:#5a5f68; text-transform:uppercase; }
  </style>
</head>
<body>
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="brand">inQueue</div>
    <h1>Sign in</h1>
    <div class="login-error" id="loginError"></div>
    <label for="usernameInput">Username</label>
    <input id="usernameInput" name="username" type="text" autocomplete="username" autofocus required>
    <label for="passwordInput">Password</label>
    <input id="passwordInput" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="loginSubmit">Sign in</button>
  </form>
  <script src="/login.js"></script>
</body>
</html>
